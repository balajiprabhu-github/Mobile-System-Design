<svg viewBox="0 0 760 410" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="760" height="410" rx="16" fill="#0B0F19"/>
  <rect x="1" y="1" width="758" height="408" rx="15" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="32" y="40" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Optimistic Write: 0ms State Machine &amp; Rollback Lifecycle</text>
  <text x="32" y="60" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Local SQLite as Single Source of Truth with deterministic failure recovery</text>

  <!-- Step 1: User Tap -->
  <rect x="32" y="90" width="130" height="90" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
  <text x="97" y="122" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1. User Action</text>
  <text x="97" y="142" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Tap "Like" Button</text>
  <text x="97" y="160" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="middle">toggleLike(id)</text>

  <!-- Arrow to DB -->
  <path d="M162 135 H202" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <!-- Step 2: Optimistic Local DB Write -->
  <rect x="210" y="90" width="220" height="90" rx="12" fill="#1E293B" stroke="#34D399" stroke-width="2"/>
  <text x="320" y="118" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2. Optimistic Mutation</text>
  <text x="320" y="138" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Update SQLite DB (0ms)</text>
  <rect x="225" y="148" width="190" height="22" rx="4" fill="rgba(52, 211, 153, 0.15)"/>
  <text x="320" y="163" fill="#34D399" font-family="monospace" font-size="10" text-anchor="middle">isLiked=true | status=PENDING</text>

  <!-- Arrow up to Reactive UI -->
  <path d="M320 90 V55 H520 V90" stroke="#34D399" stroke-width="2" stroke-dasharray="4 4" fill="none" marker-end="url(#arrow-emerald)"/>
  <text x="420" y="48" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Instant SSOT UI Re-render (&lt;5ms)</text>

  <!-- Step 3: UI Feedback -->
  <rect x="470" y="90" width="258" height="90" rx="12" fill="#111827" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <text x="599" y="118" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3. Perceived Latency: 0ms</text>
  <text x="599" y="138" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Heart icon fills red instantly</text>
  <text x="599" y="156" fill="#FBBF24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">Subtle pending sync indicator active</text>

  <!-- Step 4: Network Dispatch with Mutex -->
  <path d="M320 180 V225" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <rect x="210" y="235" width="220" height="70" rx="12" fill="#1E293B" stroke="#818CF8" stroke-width="2"/>
  <text x="320" y="260" fill="#818CF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">4. Per-Post Mutex Lock</text>
  <text x="320" y="278" fill="#E2E8F0" font-family="monospace" font-size="10" text-anchor="middle">mutex(postId).withLock { ... }</text>
  <text x="320" y="294" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">POST /interactions (Idempotent)</text>

  <!-- Split Paths: Success vs Failure -->
  <!-- Success Arrow -->
  <path d="M430 260 H500 V235 H520" stroke="#34D399" stroke-width="2" fill="none" marker-end="url(#arrow-emerald)"/>
  <!-- Failure Arrow -->
  <path d="M430 280 H500 V325 H520" stroke="#F43F5E" stroke-width="2" fill="none" marker-end="url(#arrow-rose)"/>

  <!-- Success Block -->
  <rect x="525" y="205" width="203" height="65" rx="10" fill="#111827" stroke="#34D399" stroke-width="1.5"/>
  <text x="626" y="228" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">HTTP 200 OK: Reconcile</text>
  <text x="626" y="246" fill="#F8FAFC" font-family="monospace" font-size="10" text-anchor="middle">UPDATE syncStatus = 'SYNCED'</text>
  <text x="626" y="260" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">UI clears sync spinner seamlessly</text>

  <!-- Failure Block -->
  <rect x="525" y="295" width="203" height="85" rx="10" fill="#111827" stroke="#F43F5E" stroke-width="1.5"/>
  <text x="626" y="318" fill="#F43F5E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Network Drop / 5xx: Rollback</text>
  <text x="626" y="336" fill="#F8FAFC" font-family="monospace" font-size="10" text-anchor="middle">isLiked=false | status='FAILED'</text>
  <text x="626" y="352" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">Reverts DB to pre-tap snapshot</text>
  <text x="626" y="367" fill="#FBBF24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">Transient Snackbar / Retry option</text>

  <!-- Marker Definitions -->
  <defs>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#34D399"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#F43F5E"/>
    </marker>
  </defs>
</svg>
