<svg viewBox="0 0 740 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="740" height="400" rx="16" fill="#0B0F19"/>
  <rect x="1" y="1" width="738" height="398" rx="15" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Title -->
  <text x="30" y="42" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Mobile Cache: Two-Tier Write-Time Eviction Architecture</text>
  <text x="30" y="62" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Ensures instant launch reads while guaranteeing strictly bounded SQLite storage</text>

  <!-- Network Response Block -->
  <rect x="30" y="150" width="150" height="85" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
  <text x="105" y="182" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Network Payload</text>
  <text x="105" y="202" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">20 Fresh Feed Posts</text>
  <text x="105" y="218" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">+ HTTP Date Header</text>

  <!-- Connective Arrow -->
  <path d="M180 192.5 H 230" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arrow-cyan)"/>

  <!-- Database Container -->
  <rect x="235" y="90" width="475" height="275" rx="16" fill="#111827" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <rect x="250" y="105" width="220" height="26" rx="6" fill="rgba(56, 189, 248, 0.12)"/>
  <text x="260" y="122" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">ROOM SQLITE (Single Source of Truth)</text>

  <!-- Step 1: Insert -->
  <rect x="250" y="145" width="445" height="58" rx="10" fill="#1E293B" stroke="#34D399" stroke-width="1.5"/>
  <circle cx="272" cy="174" r="12" fill="rgba(52, 211, 153, 0.2)"/>
  <text x="272" y="178" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">1</text>
  <text x="295" y="167" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">INSERT OR REPLACE</text>
  <text x="295" y="187" fill="#94A3B8" font-family="monospace" font-size="11">postDao.insertPosts(dtos.map { it.toEntity(cachedAt = now) })</text>

  <!-- Step 2: TTL Eviction -->
  <rect x="250" y="215" width="445" height="58" rx="10" fill="#1E293B" stroke="#FBBF24" stroke-width="1.5"/>
  <circle cx="272" cy="244" r="12" fill="rgba(251, 191, 36, 0.2)"/>
  <text x="272" y="248" fill="#FBBF24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">2</text>
  <text x="295" y="237" fill="#FBBF24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">TIER 1: TTL EVICTION (Time-To-Live)</text>
  <text x="295" y="257" fill="#94A3B8" font-family="monospace" font-size="11">DELETE FROM posts WHERE cachedAt &lt; (now - 24_HOURS_MS)</text>

  <!-- Step 3: Size Cap Eviction -->
  <rect x="250" y="285" width="445" height="58" rx="10" fill="#1E293B" stroke="#F43F5E" stroke-width="1.5"/>
  <circle cx="272" cy="314" r="12" fill="rgba(244, 63, 94, 0.2)"/>
  <text x="272" y="318" fill="#F43F5E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">3</text>
  <text x="295" y="307" fill="#F43F5E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">TIER 2: HARD SIZE CAP (MAX 200 POSTS)</text>
  <text x="295" y="327" fill="#94A3B8" font-family="monospace" font-size="11">DELETE FROM posts WHERE id IN (SELECT id ORDER BY timeStamp ASC LIMIT :excess)</text>

  <!-- Markers -->
  <defs>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
  </defs>
</svg>
